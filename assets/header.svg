<text x="46" y="118" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Yogesh Pannu</text></g>
<clipPath id="c0"><rect x="48" y="150" height="34" width="440" class="t" style="--w:440px;animation-delay:0s;animation-timing-function:steps(40,end)"/></clipPath>
