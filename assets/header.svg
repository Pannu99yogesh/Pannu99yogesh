<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Yogesh Pannu, Generative AI Developer">
<style>
.e{stroke:#818cf8;stroke-width:1.2;opacity:.45;stroke-dasharray:6 8;animation:flow 3s linear infinite}
.n{fill:#0f172a;stroke:#5eead4;stroke-width:2.5;animation:pulse 2.4s ease-in-out infinite}
.t{width:0;animation-name:type;animation-duration:12s;animation-iteration-count:infinite;animation-fill-mode:both}
.f{animation:rise .9s ease-out both}
.dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-42}}
@keyframes pulse{50%{fill:#5eead4;opacity:.55}}
@keyframes type{0%{width:0}13%,29%{width:var(--w)}33.2%,100%{width:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}#c0 rect{width:440px}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
